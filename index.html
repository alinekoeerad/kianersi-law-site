تبصره۱ـ به منظور صیانت از سفره آب های زیرزمینی، وزارت نیرو مکلف است با تأمین هزینه از سوی مالکان چاه ها، حداکثر طی دو سال پس از تصویب این قانون نسبت به نصب کنتورهای هوشمند برای تحویل حجمی آب در کلیه چاه های آب کشاورزی اقدام نماید.

تبصره۲ـ وزارت نیرو مکلف است ظرف مدت پنج سال پس از تصویب این قانون و از محل منابع صرفه جویی حاصل از کاهش مصرف سوخت های فسیلی ناشی از اجراء این قانون، نسبت به برقی کردن کلیه چاه های آب کشاورزی اقدام نماید.

تبصره۳ـ شرکت های آب منطقه ای مکلفند هر سه سال یک بار، مشروط به نبود تخلف از مفاد پروانه چاه توسط مالک یا مالکان، نسبت به تمدید پروانه بهره برداری چاه های آب کشاورزی در سراسر کشور اقدام نماید.

تبصره۴ـ کلیه اشخاص حقیقی و حقوقی مالک دستگاه های حفاری در سراسر کشور موظفند ظرف سه ماه پس از ابلاغ این قانون، از شرکت های آب منطقه ای استان ها مجوز فعالیت و کارت تردد دریافت و سپس به حمل و نقل و تردد اقدام نمایند. پس از انقضاء مهلت تعیین شده، نیروی انتظامی موظف به جلوگیری از حمل و نقل و یا تردد دستگاه های فاقد مجوز و کارت تردد می باشد. همچنین وزارت نیرو موظف است باهمکاری نیروی انتظامی نسبت به توقیف دستگاه های حفاری متخلف به مدت شش ماه و حمل آن به توقفگاه با هزینه مالک آن اقدام نماید.

تبصره۵ ـ وزارت نیرو مکلف است جهت رسیدگی به اختلافات ناشی از اجراء این قانون و قانون توزیع عادلانه آب مصوب۱۳۶۱، در هر استان کمیسیونی تحت عنوان «کمیسیون رسیدگی به امور آب های زیرزمینی» مرکب از یک نفر قاضی با حکم رئیس قوه قضاییه، یک نفر نماینده سازمان جهاد کشاورزی و یک نفر نماینده شرکت آب منطقه ای استان تشکیل دهد و نسبت به بررسی پرونده های شکایات اشخاص علیه دولت اقدام نماید. رأی لازم توسط قاضی عضو کمیسیون صادر می گردد. احکام صادره مذکور ظرف بیست روز پس از ابلاغ قابل تجدیدنظر در دیوان عدالت اداری می باشد.

تبصره۶ ـ هرگونه جابجایی چاه های دارای پروانه که مواجه به کاهش فاحش آبدهی گردیده و یا خشک شده است، صرفاً در اراضی آبخور اولیه چاه و حداکثر در محدوده اراضی مالک مجاز می باشد.`},{id:2,title:"آیین نامه اجرایی قانون تعیین تکلیف چاه های آب فاقد پروانه بهره برداری",content:`ماده 1- در این آیین نامه اصطلاحات زیر در معانی مشروح مربوط به کار می روند:
ت - دشت ممنوعه: دشتی که در اجرای ماده (4) قانون توزیع عادلانه آب توسط وزارت نیرو ممنوعه اعلام شده و یا می‌شود.
ث - دشت آزاد: دشتی که بیلان آبی آن مثبت و بهره برداری از منابع آب زیرزمینی آن کمتر از میزان تغذیه سفره باشد.
ج - چاه های آب کشاورزی فعال فاقد پروانه: چاه های آب کشاورزی فعال فاقد پروانه که قبل از پایان سال 1385 حفر گردیده و شناسایی شده باشند.

ماده 3- شرکت موظف است پس از وصول درخواست و مدارک متقاضی و بازدید کارشناسان، با اخذ و تطبیق مدارک با مشخصات فنی و حقوقی، مراتب را جهت صدور رأی به کمیسیون ارجاع نماید.

ماده 4- کمیسیون با بررسی مدارک ارسالی مشروط به تحقق شروط زیر اجازه صدور پروانه را صادر می‌نماید:
الف - عدم اضرار به دیگران و عموم
ب - رعایت ظرفیت آب زیرزمینی قابل تخصیص
ج - رعایت میزان آبدهی چاه

ماده 6- شرکت مکلف است هر سه سال یک بار، پروانه چاه های آب کشاورزی را مشروط به نبود تخلف تمدید نماید. مصادیق تخلف شامل: نصب منصوبات غیر مجاز، اضافه برداشت، عدم نصب کنتور هوشمند، کف شکنی و لایروبی بدون مجوز، انتقال آب به اراضی غیر آبخور اولیه، تغییر نوع کاربری، فعال نبودن آبیاری تحت فشار.

ماده 7- مصادیق اضرار به دیگران و عموم: عدم رعایت حریم منابع آب مجاور (چاه، چشمه، قنات)، اضرار به تامین نیازهای آب شرب، استمرار افت کمی و کیفی سفره در دشت های فاقد ظرفیت، ایجاد پدیده های نشست زمین، و پیش روی آب شور به سمت آب شیرین.

ماده 13- کف شکنی چاه های مجاز که دچار کاهش فاحش آبدهی (حداقل 60 درصد) یا خشک شده اند حداکثر پنج سال پس از خشک شدن مجاز است.

ماده 14- کمیسیون رسیدگی به امور آب های زیرزمینی متشکل از متخصص فنی آب، متخصص آب و خاک و یک نفر قاضی می‌باشد. آرای این کمیسیون ظرف 20 روز قابل تجدید نظر در دیوان عدالت اداری است.`},{id:3,title:"آیین‌نامه اجرائی فصل دوم - قانون توزیع عادلانه آب",content:`فصل اول - راجع به صدور پروانه حفر چاه و قنات
ماده ۱ - به استناد ماده ۳ قانون توزیع عادلانه آب هر شخص اعم از حقیقی و حقوقی و ارگانهای دولتی بخواهند از آبهای زیرزمینی به وسیله حفر چاه یا احداث قنات استفاده کنند باید تقاضای کتبی خود را به سازمانها یا شرکتهای آب تابعه وزارت نیرو تسلیم نمایند.

ماده ۳ - کارشناس ضمن بازدید محل و بررسی وضع زمینی که تقاضای حفر چاه یا قنات در آن شده است محل مناسبی را با رعایت حریم منابع آب اطراف و شناسائی طبقات مختلف زمین مشخص و با تعیین عمق چاه و آبدهی تقریبی گزارش لازم را تهیه می‌نماید.

ماده ۴ - کمیسیون رسیدگی به صدور پروانه‌ها پس از وصول پرونده امر در صورت موافقت مراتب را به شرکت مربوطه اعلام می‌نماید.

ماده ۸ - پروانه حفر چاه بنام متقاضی صادر می‌گردد. چنانچه ظرف یک سال اقدامی برای حفر چاه به عمل نیاید پروانه صادره از درجه اعتبار ساقط است.

ماده ۹ - اعلام ممنوعیت مناطق برای حفر چاه و قنات جدید به منظور استحصال آب بیشتر از طرف وزارت نیرو به وسیله نشر آگهی در روزنامه رسمی کشور انجام می‌شود.

ماده ۱۰ - در مناطق ممنوع ادامه پیشکار قنوات یا کف‌شکنی چاه‌هائی که آبدهی آنها نقصان یافته به منظور تأمین آب سابق با اخذ پروانه مجاز است.

ماده ۱۱ - در مناطق ممنوعه حفر چاه یا قنات بجای چاه و یا قناتی که خشک شده مجاز است مشروط به آن که از آب جدید فقط زمینهائی آبیاری شوند که قبلاً مشروب می‌شده‌اند و در حریم منابع آب دیگری نباشد. مهلت مراجعه حداکثر پنج سال پس از خشک شدن می‌باشد.

ماده ۲۴ - تخلفات: مأمورین شرکتها در مورد چاه‌هائی که بدون مجوز قانونی حفر می‌شوند نسبت به پرو مسلوب‌المنفعه نمودن چاه اقدام خواهند نمود و در مورد بهره برداری بیش از حد مجاز، منصوبات غیرمجاز را ضبط میکنند.`},{id:4,title:"آیین‌نامه حریم مخازن، تأسیسات آبی، کانالهای عمومی آبرسانی، آبیاری و زهکشی",content:`ماده ۱ - مخازن، تأسیسات آب، کانال‌های عمومی آبرسانی، آبیاری و زهکشی مستحدثاتی هستند که به منظور آبرسانی، سالم‌سازی زمینها یا انتقال آب ایجاد شده‌اند.

ماده ۲ - حریم شبکه‌های آبیاری و زهکشی با توجه به ظرفیت آبدهی:
۱ - آبدهی بیش از ۱۵ متر مکعب در ثانیه - حریم از هر طرف ۱۲ متر.
۲ - آبدهی از ۱۰ تا ۱۵ متر مکعب در ثانیه - حریم از هر طرف ۸ متر.
۳ - آبدهی از ۵ تا ۱۰ متر مکعب در ثانیه - حریم از هر طرف ۶ متر.
۴ - آبدهی از ۲ تا ۵ متر مکعب در ثانیه - حریم از هر طرف ۴ متر.
۵ - آبدهی از ۱۵۰ لیتر تا ۲ متر مکعب در ثانیه - حریم از هر طرف ۱ تا ۲ متر.
۶ - آبدهی کمتر از ۱۵۰ لیتر در ثانیه - حریم از هر طرف ۱ متر.

ماده ۳ - حریم لوله‌های آبرسانی:
- قطر تا ۵۰۰ میلیمتر: ۳ متر از هر طرف.
- قطر ۵۰۰ تا ۸۰۰ میلیمتر: ۴ متر از هر طرف.
- قطر ۸۰۰ تا ۱۲۰۰ میلیمتر: ۵ متر از هر طرف.
- قطر ۱۲۰۰ میلیمتر به بالا: ۶ متر از هر طرف.

ماده ۴ - کانال عمومی واقع در داخل مزارع و باغها تا مساحت ۱۰۰ هکتار که اختصاصا برای آبیاری همان محل است، دارای حریم نیستند.

ماده ۵ - اداره‌های ثبت اسناد مکلفند بیست روز قبل از تحدید حدود املاک واقع در مجاورت منابع آبی، روز تحدید را به شرکتهای آب منطقه‌ای اطلاع دهند.

ماده ۸ - هر گاه در اجرای این آیین‌نامه، زمینهای اشخاص در مسیر و حریم کانالها قرار گیرد، بهای عادلانه روز آنها به مالکان پرداخت می‌شود.`},{id:5,title:"آئين نامه موضوع تبصره 34 قانون توزيع عادلانه آب",content:`ماده 1 - آب بران مكلفند بهاي آب مصرفي خود يا عوارض آن را بر اساس نرخ مصوب و در خصوص آب كشاورزي معادل درصد تعيين شده از محصول را بپردازند.

ماده 2 - صورتحساب بهاي آب مصرفي براي مصرف كنندگان كشاورزي، سالي يك تا چهار بار و براي مصارف شهري و صنعتي حداكثر هر سه ماه يكبار صادر مي شود.

ماده 4 - تا زماني كه تعيين مقدار آب كشاورزي به صورت حجمي مقدور نباشد مقدار آب تحويلي به هر هكتار زمين زيركشت با توجه به نوع محصول و شرايط اقليمي برآورد خواهد شد.

ماده 5 - درصورت عدم پرداخت به موقع بهاي آب، آب مستنكف از طريق پلمپ محل انشعاب قطع خواهد شد.

ماده 6 - هرگاه قطع آب از نظر فني مقدور نباشد آب بها از طريق اداره ثبت اسناد و املاك محل وصول خواهد شد.

ماده 10 - معترضان به صورتحساب مي توانند تا دو ماه از تاريخ صدور اعتراض خود را به سازمان وصول كننده ارسال نمايند. اعتراض موجب تاخير در پرداخت نمي گردد.`},{id:6,title:"آیین نامه جلوگيري از آلودگي آب",content:`ماده 1- اصطلاحات:
آلودگي آب: تغيير مواد محلول يا معلق يا درجه حرارت در حدي كه آب را براي مصرف مقرر مضر سازد.
فاضلاب: هر نوع مايع زايد حاصل از فعاليتهاي صنعتي، كشاورزي، شهري يا بيمارستاني كه به آب يا خاك تخليه گردد.
مواد زايد خطرناك: هر نوع ضايعاتي كه قدرت صدمه به سلامت انسان يا موجودات زنده را دارد.

ماده 2 - اقدام به هر عملي كه موجبات آلودگي آب را فراهم نمايد ممنوع است.

ماده 7- سازمان حفاظت محیط زیست موظف است از منابع آلوده كننده نمونه برداري نمايد. در صورتي كه شدت آلودگي بيش از حد استاندارد باشد، مراتب كتباً اخطار ميگردد تا در مهلت مقرر رفع آلودگي شود.

ماده 8- مسؤولين مكلفند ظرف مهلت مقرر نسبت به رفع آلودگي اقدام كنند در غير اين صورت از فعاليت منبع آلوده کننده ممانعت خواهد شد.

ماده 11- مراجع صدور پروانه احداث و توسعه واحدهاي صنعتي و كشاورزي موظفند صدور پروانه را موكول به رعايت مقررات و استانداردهاي محیط زیستی نمایند.

ماده 17- رقيق كردن در مرحله تخليه به عنوان تصفيه ممنوع است.

ماده 22- تخلف از مقررات كه موجب خسارت به محيط زيست شود پيگرد قانوني و پرداخت خسارت به همراه خواهد داشت.`},{id:7,title:"آیین‌نامه اجرایی قانون ابطال اسناد و فروش رقبات، آب و اراضی موقوفه",content:`ماده ۲ - ادارات اوقاف مکلفند با توجه به سوابق ثبتی موقوفات عامه‌ای را که به ملکیت اشخاص درآمده باشد، صورت‌برداری و به سازمان اوقاف ارسال نمایند تا کمیسیونی مرکب از فقها بررسی کند که آیا فروش شرعی بوده یا خیر. در صورت بطلان، سند ملک باطل و مجدداً به نام موقوفه ثبت میگردد.

ماده ۳ - پس از ابطال اسناد، متصرف برای تنظیم سند اجاره دعوت می‌شود و در صورت عدم مراجعه پس از ۳۰ روز، خلع ید صورت میپذیرد.

ماده ۶ - ادارات اوقاف پس از ابطال اسناد انتقالی زارعان، با آنها قرارداد اجاره تنظیم مینمایند. اگر زارع چاه حفر کرده باشد موقوفه در صورت امکان آن را میخرد و گرنه در اجاره بها حقوق زارع در چاه منظور میگردد.

ماده ۷ - کلیه اعیانی و مستحدثاتی که زارعان صاحب نسق احداث نموده باشند متعلق به آنان خواهد بود و سند اجاره فقط نسبت به عرصه تنظیم خواهد شد.

ماده ۸ - تغییر کاربری زراعی و احداث هر گونه اعیانی بدون مجوز در اراضی موقوفه ممنوع می‌باشد.`},{id:8,title:"آیین‌نامه مربوط به بستر و حریم رودخانه‌ها، انهار، مسیلها، مردابها و...",content:`ماده ۱ - تعاریف:
بستر: آن قسمت از رودخانه، نهر یا مسیل است که با توجه به آمار هیدرولوژیک و حداکثر طغیان با دوره برگشت ۲۵ ساله تعیین می‌شود. تغییرات طبیعی بستر در بستر سابق تأثیری نداشته و کماکان در اختیار حکومت اسلامی است.
حریم: اراضی اطراف رودخانه، مرداب و برکه طبیعی که بلافاصله پس از بستر قرار دارد و به عنوان حق ارتفاق برای کمال انتفاع و حفاظت آنها لازم است (از ۱ تا ۲۰ متر متغیر است).

ماده ۳- شرکتهای آب منطقه ای موظفند حد بستر و حریم را با انتشار آگهی محلی به اطلاع اشخاص برسانند. معترضین یک ماه فرصت دارند تا اعتراض خود را تسلیم کنند.

ماده ۶ - پس از قطعی شدن میزان بستر و حریم، در صورتی که شرکت آب قلع و قمع اعیانی واقع در بستر و حریم را لازم بداند اقدام خواهد کرد.

ماده ۷ - کشت موقت در بستر در صورتی که مزاحمتی برای بهره‌برداری آب ایجاد نکند با موافقت کتبی و عدم ایجاد اعیانی و درخت بلامانع است.

ماده ۱۳ - هر نوع تصرف در بستر و حریم رودخانه‌ها منوط به موافقت کتبی وزارت نیرو است و متخلفان مجازات میشوند.

ماده ۱۵ - حریم کانالها و شبکه های احداثی بر اساس دبی جریان از ۱ متر (برای دبی کمتر از ۱۵۰ لیتر) تا ۱۵ متر (برای دبی بیش از ۱۵ مترمکعب) از منتهی الیه دیواره تعیین میشود.`}];function Hy(){const z=D=>D?D.split(`
